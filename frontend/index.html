    <!-- Default: NOT indexed. Public pages (Home, /track, /store/product/:id)
         override this via <Helmet> with content="index, follow". Any route
         that forgets to add that override safely stays out of Google's index
         instead of accidentally leaking the BMS/admin shell into search. -->
    <meta name="robots" content="noindex" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
